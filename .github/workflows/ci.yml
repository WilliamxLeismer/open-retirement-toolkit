name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and statistical tests with coverage gates
        run: npm run test:coverage
      - name: 10,000-trial performance smoke test
        run: npm run test:performance
      - name: Type-check and production build
        run: npm run build
